<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wablo Opticals admin</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2b3e;--glass:#eef1f4;--amber:#f2a900;--line:#c9d3db}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--glass);color:var(--ink);padding:16px;max-width:720px;margin-inline:auto}
h1{font-size:22px;font-weight:800}h2{font-size:17px;margin:24px 0 8px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}input[type=range]{padding:0}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 14px;cursor:pointer;background:var(--ink);color:#fff}button.main{background:var(--amber);color:var(--ink)}button.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}button:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1}
.pv{margin-top:10px;background:repeating-conic-gradient(#dfe5ea 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px;min-height:120px;display:flex;justify-content:center}.pv img{max-width:100%;max-height:200px;object-fit:contain}
.item{display:flex;gap:12px;align-items:center;background:#fff;border-radius:12px;padding:10px;margin-top:10px;flex-wrap:wrap}.item img{width:72px;height:72px;object-fit:contain;background:var(--glass);border-radius:8px}.item .t{flex:1;min-width:140px}.item b{display:block}
.err{font-size:14px;margin-top:8px;min-height:1em}
#cam{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:9}#cam.on{display:flex}#cam .stage{flex:1;min-height:0}#cam canvas{width:100%;height:100%;object-fit:cover}#cam video{display:none}
#cam .ctl{background:var(--ink);color:#fff;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:14px}
</style></head><body>
<h1>wablo opticals</h1>
<section id="login" hidden><label for="pw">Admin password</label><input id="pw" type="password"><div class="row"><button class="main" id="in">Log in</button></div><div class="err" id="lerr"></div></section>
<section id="app" hidden>
<h2>New try-on</h2>
<label for="type">Product type</label><select id="type"><option value="specs">Specs</option><option value="watch">Watch</option></select>
<label for="name">Name</label><input id="name" maxlength="80">
<label for="price">Price (₹)</label><input id="price" type="number" min="0" inputmode="numeric">
<label for="file">Product picture (front view for specs, dial facing you for watches)</label><input id="file" type="file" accept="image/*">
<label for="bg">Background removal</label><select id="bg"><option value="all">Plain background, clear lens areas too</option><option value="edge">Plain background, outside edge only</option><option value="none">None (picture is already transparent)</option></select>
<label for="tol">Removal strength</label><input id="tol" type="range" min="10" max="140" value="70">
<div class="pv" id="pv"></div>
<div class="row"><button class="ghost" id="try" disabled>Test on camera</button><button class="main" id="pub" disabled>Create try-on link</button></div>
<div class="err" id="err" role="status"></div>
<h2>Your try-ons (saved on this phone)</h2><div id="list"></div>
</section>
<div id="cam"><div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div class="ctl"><label for="sc" style="margin:0">Size</label><input id="sc" type="range" min=".4" max="1.8" step=".02" value="1"><label for="ox" style="margin:0">Left / right</label><input id="ox" type="range" min="-.4" max=".4" step=".01" value="0"><label for="oy" style="margin:0">Up / down</label><input id="oy" type="range" min="-.4" max=".4" step=".01" value="0"><button class="ghost" id="flip">Flip camera</button><button class="main" id="done">Done</button></div></div>
<script type="module">
import{startTryOn}from'./tryon.js';
import CFG from'./config.js';
const $=i=>document.getElementById(i),inr=n=>'₹'+Number(n).toLocaleString('en-IN');let proc=null,cur=null,T=null;
const get=()=>{try{return JSON.parse(localStorage.wp||'[]')}catch{return[]}},put=l=>localStorage.wp=JSON.stringify(l);
function show(a){$('login').hidden=a;$('app').hidden=!a;if(a){$('list').innerHTML='';const l=get();if(!l.length)$('list').textContent='Nothing yet. Create your first try-on above.';l.forEach(card)}}
$('in').onclick=()=>{if($('pw').value===CFG.password){localStorage.wa='1';show(true)}else $('lerr').textContent='Wrong password'};$('pw').onkeydown=e=>e.key==='Enter'&&$('in').click();
function card(p){const d=document.createElement('div');d.className='item';d.innerHTML=`<img src="${p.thumb}" alt=""><div class="t"><b></b>${inr(p.price)} · ${p.type==='watch'?'Watch':'Specs'}</div><div class="row" style="margin:0"><button class="ghost" data-a="c">Copy link</button><button class="main" data-a="w">Share on WhatsApp</button><button class="ghost" data-a="d">Remove</button></div>`;
d.querySelector('b').textContent=p.name;
d.onclick=async e=>{const a=e.target.dataset.a;if(a==='c'){await navigator.clipboard.writeText(p.link);e.target.textContent='Copied'}
if(a==='w'){const text=`${p.name} - ${inr(p.price)}\nTry it on live:\n${p.link}`;try{const b=await(await fetch(p.thumb)).blob(),f=new File([b],'wablo.jpg',{type:b.type});if(navigator.canShare?.({files:[f]}))return await navigator.share({files:[f],text})}catch{}open('https://wa.me/?text='+encodeURIComponent(text))}
if(a==='d'&&confirm('Remove from this list? The link keeps working.')){put(get().filter(x=>x.link!==p.link));d.remove()}};$('list').prepend(d)}
async function prep(){const f=$('file').files[0];$('err').textContent='';proc=null;$('try').disabled=$('pub').disabled=true;if(!f)return;
try{proc=await clean(f,$('bg').value,+$('tol').value);$('pv').innerHTML=`<img src="${proc}" alt="Processed product">`;$('try').disabled=$('pub').disabled=false}catch(e){$('err').textContent=e.message}}
['file','bg','tol'].forEach(i=>$(i).addEventListener(i==='tol'?'change':'input',prep));
async function clean(file,mode,tol){const im=await createImageBitmap(file),s=Math.min(1,900/Math.max(im.width,im.height)),w=Math.round(im.width*s),h=Math.round(im.height*s),N=w*h,c=document.createElement('canvas');c.width=w;c.height=h;
const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,w,h);const d=x.getImageData(0,0,w,h),a=d.data;
if(mode!=='none'&&a[3]>200){const cs=[0,w-1,(h-1)*w,h*w-1],bg=[0,1,2].map(k=>cs.reduce((t,i)=>t+a[i*4+k],0)/4),bl=(bg[0]+bg[1]+bg[2])/3,
dist=i=>Math.hypot(a[i*4]-bg[0],a[i*4+1]-bg[1],a[i*4+2]-bg[2]),
near=i=>{if(a[i*4+3]===0)return false;const r=a[i*4],g=a[i*4+1],b=a[i*4+2],l=(r+g+b)/3;return dist(i)<tol||(Math.max(r,g,b)-Math.min(r,g,b)<28&&l>bl-tol*1.1)};
if(mode==='all'){for(let i=0;i<N;i++)if(near(i))a[i*4+3]=0}else{const seen=new Uint8Array(N),st=[],push=i=>{if(!seen[i]&&near(i)){seen[i]=1;st.push(i)}};
for(let X=0;X<w;X++){push(X);push((h-1)*w+X)}for(let Y=0;Y<h;Y++){push(Y*w);push(Y*w+w-1)}
while(st.length){const i=st.pop(),X=i%w;a[i*4+3]=0;if(X>0)push(i-1);if(X<w-1)push(i+1);if(i>=w)push(i-w);if(i<N-w)push(i+w)}}
const nb=i=>{const X=i%w;return[X>0?i-1:-1,X<w-1?i+1:-1,i>=w?i-w:-1,i<N-w?i+w:-1]},fr=[];
for(let i=0;i<N;i++)if(a[i*4+3]&&nb(i).some(k=>k>=0&&a[k*4+3]===0)&&dist(i)<tol*1.8)fr.push(i);
fr.forEach(i=>a[i*4+3]=0);
const lab=new Int32Array(N),sz=[0];let nl=0;
for(let i=0;i<N;i++){if(lab[i]||a[i*4+3]<=20)continue;nl++;let n=0;const st=[i];lab[i]=nl;while(st.length){const j=st.pop();n++;for(const k of nb(j))if(k>=0&&!lab[k]&&a[k*4+3]>20){lab[k]=nl;st.push(k)}}sz.push(n)}
const mx=Math.max(...sz);for(let i=0;i<N;i++)if(lab[i]&&sz[lab[i]]<mx*.08)a[i*4+3]=0}
x.putImageData(d,0,0);let x0=w,y0=h,x1=-1,y1=-1;for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++)if(a[(Y*w+X)*4+3]>20){if(X<x0)x0=X;if(X>x1)x1=X;if(Y<y0)y0=Y;if(Y>y1)y1=Y}
if(x1<=x0||y1<=y0)throw new Error('Nothing is left after removing the background. Lower the removal strength or choose "None".');
const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);return o.toDataURL('image/png')}
const sync=()=>{cur&&Object.assign(cur,{scale:+$('sc').value,ox:+$('ox').value,oy:+$('oy').value})};
$('type').onchange=()=>{$('bg').value=$('type').value==='specs'?'all':'edge';prep()};
$('try').onclick=async()=>{cur={image:proc,type:$('type').value,scale:+$('sc').value,ox:+$('ox').value,oy:+$('oy').value,name:$('name').value||'Preview',price:+$('price').value||0};
$('cam').classList.add('on');try{T=await startTryOn({video:$('v'),canvas:$('c'),product:cur})}catch(e){$('cam').classList.remove('on');$('err').textContent=e.name==='NotAllowedError'?'Camera is blocked. Allow camera access for this site.':e.message}};
['sc','ox','oy'].forEach(i=>$(i).oninput=sync);$('flip').onclick=()=>T&&T.flip();$('done').onclick=()=>{T&&T.stop();T=null;$('cam').classList.remove('on')};
$('pub').onclick=async()=>{const b=$('pub'),name=$('name').value.trim();if(!name){$('err').textContent='Enter a name first.';return}b.disabled=true;$('err').textContent='Uploading…';
try{const f=new FormData();f.append('file',proc);f.append('upload_preset',CFG.preset);const r=await fetch(`https://api.cloudinary.com/v1_1/${CFG.cloud}/image/upload`,{method:'POST',body:f}),j=await r.json();
if(!r.ok)throw new Error(j.error?.message==='Upload preset not found'?'Cloudinary preset "'+CFG.preset+'" not found. Create it as Unsigned.':j.error?.message||'Upload failed');
const s=cur?cur.scale:+$('sc').value,x=cur?cur.ox:0,y=cur?cur.oy:0,type=$('type').value,price=+$('price').value||0,
link=new URL('t.html',location.href);link.search=new URLSearchParams({i:j.public_id,n:name,p:price,t:type,s,x,y});
const base=`https://res.cloudinary.com/${CFG.cloud}/image/upload/`,p={name,price,type,link:link.href,thumb:base+'b_rgb:eef1f4,c_pad,w_800,h_800,f_jpg/'+j.public_id};
put([p,...get()]);card(p);$('name').value=$('price').value=$('file').value='';$('pv').innerHTML='';proc=cur=null;$('try').disabled=true;$('err').textContent='Done. Tap "Share on WhatsApp" below.'}
catch(e){$('err').textContent=e.message;b.disabled=false}};
$('type').onchange();show(localStorage.wa==='1');
</script></body></html>
