<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2b3e">
<title>Try it on | Wablo Opticals</title><meta property="og:title" content="Try it on live | Wablo Opticals"><meta property="og:description" content="Open the link and try this on with your phone camera"><meta property="og:image" content="https://psk901.github.io/wablo-opticals/og.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d2b3e;--glass:#eef1f4;--amber:#f2a900}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Manrope,system-ui,sans-serif;background:var(--ink);color:var(--glass);display:flex;flex-direction:column;overflow:hidden}
.stage{position:relative;flex:1;min-height:0;background:#000}canvas{width:100%;height:100%;object-fit:cover;display:block}video{display:none}
.brand{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:16px;font-weight:800;font-size:18px;text-shadow:0 1px 8px #0008}
.hint,.msg{position:absolute;left:16px;right:16px;text-align:center;font-size:14px}.hint{top:calc(52px + env(safe-area-inset-top,0px));text-shadow:0 1px 8px #000a}
.msg{top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet{padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px}
.info{flex:1;min-width:0}.info h1{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info p{font-size:20px;color:var(--amber);font-weight:800}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;background:var(--glass);color:var(--ink)}button.main{background:var(--amber)}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style></head><body>
<div class="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas><div class="brand">wablo opticals</div><div class="hint" id="hint"></div><div class="msg" id="msg"></div></div>
<div class="sheet"><div class="info"><h1 id="n"></h1><p id="pr"></p></div><button id="flip">Flip</button><button class="main" id="snap">Save photo</button></div>
<script type="module">
import{startTryOn}from'./tryon.js';
import CFG from'./config.js';
const q=new URLSearchParams(location.search),$=i=>document.getElementById(i),id=q.get('i')||'';let T;
const P={name:q.get('n')||'Product',price:+q.get('p')||0,type:q.get('t')==='watch'?'watch':'specs',scale:+q.get('s')||1,ox:+q.get('x')||0,oy:+q.get('y')||0,
image:`https://res.cloudinary.com/${CFG.cloud}/image/upload/f_png,w_900/${id}`};
$('n').textContent=P.name;$('pr').textContent='₹'+P.price.toLocaleString('en-IN');
$('hint').textContent=P.type==='watch'?'Show the back of your wrist, fingers pointing up':'Look straight at the camera';
async function go(){$('msg').innerHTML='';if(!/^[\w\-\/.]+$/.test(id)){$('msg').textContent='This link is incomplete. Ask for the link again.';return}
try{T=await startTryOn({video:$('v'),canvas:$('c'),product:P,onStatus:s=>$('msg').textContent=s})}
catch(e){$('msg').innerHTML=`<span>${e.name==='NotAllowedError'?'Camera is blocked. Allow camera access for this site, then try again.':'Could not start the try-on: '+e.message}</span><button class="main" id="again">Try again</button>`;$('again').onclick=go}}
$('flip').onclick=()=>T&&T.flip();
$('snap').onclick=async()=>{if(!T)return;const b=await T.snap(),f=new File([b],'tryon.jpg',{type:'image/jpeg'});
if(navigator.canShare?.({files:[f]}))try{return await navigator.share({files:[f],text:`${P.name} - ${location.href}`})}catch{return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tryon.jpg';a.click()};
go();
</script></body></html>
